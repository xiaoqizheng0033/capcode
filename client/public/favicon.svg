<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Eagle head silhouette on transparent bg -->
  <path d="M50 15 L63 10 L75 16 Q82 20 76 28 L62 36 Q52 40 50 34 Z"
    fill="#1e3a5f" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- Eye + magnifier -->
  <circle cx="64" cy="20" r="3" fill="#fbbf24"/>
  <circle cx="64" cy="20" r="1.2" fill="#1e3a5f"/>
  <circle cx="64" cy="20" r="5" stroke="#fbbf24" stroke-width="1" fill="none"/>
  <line x1="67.5" y1="23.5" x2="72" y2="28" stroke="#fbbf24" stroke-width="1"/>
  <!-- Beak -->
  <path d="M76 20 L88 18 L82 24 L76 25 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.5"/>
  <!-- Code wing -->
  <text x="10" y="65" fontSize="14" fill="#60a5fa" font-family="monospace" font-weight="bold">{ } < /></text>
  <!-- AI badge -->
  <circle cx="78" cy="65" r="10" fill="#fbbf24"/>
  <text x="72" y="69" fontSize="9" fill="#1e3a5f" font-family="monospace" font-weight="bold">AI</text>
</svg>
